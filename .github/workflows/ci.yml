name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI はコードを読んでテストするだけなので、GITHUB_TOKEN は読み取りに絞る。
# 既定はリポジトリ設定まかせで、書き込み権限が渡ることがある。
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # 失敗したら ntfy に通知（ai-dev-harness のテンプレートから。リポジトリのシークレット NTFY_TOPIC があるときだけ。値はログに出ない）
      - name: 失敗を通知
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          REF: ${{ github.ref_name }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          jq -n --arg topic "$NTFY_TOPIC" --arg title "CI 失敗: $REPO" --arg msg "$WORKFLOW（$REF）が失敗した" --arg url "$URL" \
            '{topic: $topic, title: $title, message: $msg, priority: 4, tags: ["x"], click: $url}' \
            | curl -fsS --max-time 10 -o /dev/null -H 'Content-Type: application/json' --data-binary @- https://ntfy.sh/ || true
